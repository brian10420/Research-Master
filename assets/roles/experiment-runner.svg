<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="experiment-runner: a polar bear with lab goggles pushed up on the forehead and a flask">
  <!-- research-master role bear: experiment-runner (isolated subagent). Family rule: same head on all fourteen, the prop is the only difference. -->
  <!-- backdrop: the logo's rounded square, halved; indigo tint = isolated subagent -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="#E6EAF3"/>
  <!-- bear: assets/logo.svg lines 7-27 verbatim (same cx/cy/r), mortarboard left out;
       the logo's translate(0 -12), halved, shifted left/up to make room for the prop -->
  <g transform="translate(-14 -16) scale(0.5) translate(0 -12)" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears (right ear sits a touch lower) -->
    <g stroke="#435954" stroke-width="14">
      <circle cx="146" cy="214" r="38" fill="#FDFEFD"/>
      <circle cx="368" cy="228" r="38" fill="#FDFEFD"/>
    </g>
    <circle cx="142" cy="210" r="17" fill="#E4E8E6"/>
    <circle cx="372" cy="224" r="17" fill="#E4E8E6"/>
    <!-- head -->
    <ellipse cx="256" cy="316" rx="156" ry="126" fill="#FDFEFD" stroke="#435954" stroke-width="14"/>
    <!-- face: muzzle, nose, mouth, cross-eyed eyes -->
    <ellipse cx="256" cy="366" rx="62" ry="46" fill="#E4E8E6"/>
    <path d="M236 338 Q256 330 276 338 Q272 356 256 358 Q240 356 236 338 Z" fill="#1D2523"/>
    <path d="M256 358 V372 M238 371 Q247 381 256 372 Q277 398 302 361" fill="none" stroke="#1D2523" stroke-width="8"/>
    <g fill="#FDFEFD" stroke="#1D2523" stroke-width="8">
      <circle cx="198" cy="300" r="25"/>
      <circle cx="314" cy="300" r="25"/>
    </g>
    <circle cx="208" cy="305" r="13" fill="#1D2523"/>
    <circle cx="304" cy="305" r="13" fill="#1D2523"/>
  </g>
  <!-- prop 1/2: lab goggles pushed up on the forehead -->
  <g stroke="#41507A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 104 Q60 94 78 92 M150 92 Q168 94 180 104 M108 92 H120" fill="none" stroke-width="9"/>
    <g fill="#E6EAF3" stroke-width="7">
      <rect x="78" y="80" width="30" height="24" rx="10"/>
      <rect x="120" y="80" width="30" height="24" rx="10"/>
    </g>
    <path d="M85 89 L92 85 M127 89 L134 85" fill="none" stroke="#FDFEFD" stroke-width="4"/>
  </g>
  <!-- prop 2/2: conical flask, indigo liquid -->
  <g transform="translate(190 232)" stroke="#435954" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10 -72 V-46 L-36 -6 Q-40 2 -31 2 H31 Q40 2 36 -6 L10 -46 V-72 Z" fill="#FDFEFD" stroke="none"/>
    <path d="M-24.3 -24 L-36 -6 Q-40 2 -31 2 H31 Q40 2 36 -6 L24.3 -24 Z" fill="#41507A" stroke="none"/>
    <circle cx="-6" cy="-12" r="3.5" fill="#FDFEFD" stroke="none"/>
    <circle cx="9" cy="-16" r="2.5" fill="#FDFEFD" stroke="none"/>
    <path d="M-10 -72 V-46 L-36 -6 Q-40 2 -31 2 H31 Q40 2 36 -6 L10 -46 V-72" fill="none" stroke-width="6"/>
    <path d="M-15 -74 H15" fill="none" stroke-width="7"/>
  </g>
</svg>
