<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="study-coach: a polar bear with a coach's whistle on a lanyard">
  <!-- research-kernel role bear: study-coach (shared-context skill). Family rule: same head on all fourteen, the prop is the only difference. -->
  <!-- backdrop: the logo's rounded square, halved; teal-green tint = shared-context skill -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="#E3EDE9"/>
  <!-- lanyard: drawn before the bear so it disappears behind the chin -->
  <path d="M80 186 Q100 238 162 202 M150 186 Q156 198 162 202" fill="none" stroke="#0F6B62" stroke-width="5" stroke-linecap="round"/>
  <!-- bear: assets/logo.svg lines 7-27 verbatim (same cx/cy/r), mortarboard left out;
       the logo's translate(0 -12), halved, shifted left/up to make room for the prop -->
  <g transform="translate(-14 -16) scale(0.5) translate(0 -12)" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears (right ear sits a touch lower) -->
    <g stroke="#435954" stroke-width="14">
      <circle cx="146" cy="214" r="38" fill="#FDFEFD"/>
      <circle cx="368" cy="228" r="38" fill="#FDFEFD"/>
    </g>
    <circle cx="142" cy="210" r="17" fill="#E4E8E6"/>
    <circle cx="372" cy="224" r="17" fill="#E4E8E6"/>
    <!-- head -->
    <ellipse cx="256" cy="316" rx="156" ry="126" fill="#FDFEFD" stroke="#435954" stroke-width="14"/>
    <!-- face: muzzle, nose, mouth, cross-eyed eyes -->
    <ellipse cx="256" cy="366" rx="62" ry="46" fill="#E4E8E6"/>
    <path d="M236 338 Q256 330 276 338 Q272 356 256 358 Q240 356 236 338 Z" fill="#1D2523"/>
    <path d="M256 358 V372 M238 371 Q247 381 256 372 Q277 398 302 361" fill="none" stroke="#1D2523" stroke-width="8"/>
    <g fill="#FDFEFD" stroke="#1D2523" stroke-width="8">
      <circle cx="198" cy="300" r="25"/>
      <circle cx="314" cy="300" r="25"/>
    </g>
    <circle cx="208" cy="305" r="13" fill="#1D2523"/>
    <circle cx="304" cy="305" r="13" fill="#1D2523"/>
  </g>
  <!-- prop: coach's whistle hanging from the lanyard -->
  <g transform="translate(196 208) rotate(-14) scale(1.2)" stroke="#435954" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-26" cy="-12" r="6" fill="none" stroke-width="4"/>
    <path d="M46 -22 H0 A22 22 0 1 0 21.2 -6 H46 Z" fill="#0F6B62" stroke-width="6"/>
    <path d="M4 -22 V-15 H14 V-22" fill="#1D2523" stroke-width="3"/>
    <circle cx="-6" cy="4" r="7" fill="#FDFEFD" stroke="none"/>
  </g>
</svg>
