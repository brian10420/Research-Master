<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="research-master logo: a slightly cross-eyed polar-bear head with a lopsided smile, wearing a crooked black graduation mortarboard with an amber tassel, on a soft green rounded square.">
  <!-- backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#E3EDE9"/>

  <!-- bear + cap, lifted 12 units to centre the figure optically -->
  <g transform="translate(0 -12)" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears (right ear sits a touch lower) -->
    <g stroke="#435954" stroke-width="14">
      <circle cx="146" cy="214" r="38" fill="#FDFEFD"/>
      <circle cx="368" cy="228" r="38" fill="#FDFEFD"/>
    </g>
    <circle cx="142" cy="210" r="17" fill="#E4E8E6"/>
    <circle cx="372" cy="224" r="17" fill="#E4E8E6"/>

    <!-- head -->
    <ellipse cx="256" cy="316" rx="156" ry="126" fill="#FDFEFD" stroke="#435954" stroke-width="14"/>

    <!-- face: muzzle, nose, mouth, cross-eyed eyes -->
    <ellipse cx="256" cy="366" rx="62" ry="46" fill="#E4E8E6"/>
    <path d="M236 338 Q256 330 276 338 Q272 356 256 358 Q240 356 236 338 Z" fill="#1D2523"/>
    <path d="M256 358 V372 M238 371 Q247 381 256 372 Q277 398 302 361" fill="none" stroke="#1D2523" stroke-width="8"/>
    <g fill="#FDFEFD" stroke="#1D2523" stroke-width="8">
      <circle cx="198" cy="300" r="25"/>
      <circle cx="314" cy="300" r="25"/>
    </g>
    <circle cx="208" cy="305" r="13" fill="#1D2523"/>
    <circle cx="304" cy="305" r="13" fill="#1D2523"/>

    <!-- cap: band on the crown, then the board tilted 15 degrees -->
    <path d="M196 214 L218 140 L363 165 L340 252 Q262 256 196 214 Z" fill="#1D2523" stroke="#435954" stroke-width="8"/>
    <g transform="translate(268 136) rotate(15)">
      <path d="M-150 0 L0 -44 L150 0 L0 44 Z" fill="#1D2523" stroke="#435954" stroke-width="8"/>
      <!-- tassel cord across the board -->
      <path d="M0 0 L150 0" fill="none" stroke="#A9761C" stroke-width="7"/>
      <circle cx="0" cy="0" r="10" fill="#A9761C"/>
    </g>

    <!-- tassel hanging off the low corner -->
    <g fill="#A9761C">
      <path d="M413 175 V248" fill="none" stroke="#A9761C" stroke-width="7"/>
      <rect x="404" y="242" width="18" height="14" rx="4"/>
      <path d="M402 256 H424 L430 302 Q413 310 396 302 Z"/>
    </g>
  </g>
</svg>
