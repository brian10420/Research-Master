<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="448" viewBox="0 0 1400 448" role="img" aria-label="Which dispatch profile? The Plan tier line in your overlay decides it. free, pro, max, team-standard and team-premium give guarded: one isolated dispatch at a time, small workflows; a missing or unreadable slot also runs guarded until you answer. ultra, enterprise and api give open: independent stages in parallel, workflows unconstrained. Nothing else moves with the profile, and open never means free: every plan keeps a weekly limit.">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#435954"/>
    </marker>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>

  <rect x="0" y="0" width="1400" height="448" fill="#F3F5F4"/>

    <text class="mono" x="24" y="28" font-size="11" fill="#5A6663" letter-spacing="2">RESEARCH-MASTER · DECISION_008 (accepted)</text>
    <text class="sans" x="24" y="60" font-size="26" font-weight="700" fill="#1D2523">Which dispatch profile?</text>

  <g id="overlay">
    <rect x="20" y="80" width="344" height="260" rx="8" fill="#FDFEFD" stroke="#C6CFCB" stroke-width="1.3"/>
    <path d="M 38 96 H 49 L 54 101 V 117 H 38 Z" fill="none" stroke="#77827E" stroke-width="1.3"/>
    <path d="M 49 96 V 101 H 54" fill="none" stroke="#77827E" stroke-width="1.3"/>
    <text class="mono" x="64" y="113" font-size="12" fill="#1D2523">.claude/research-master.overlay.md</text>
    <rect x="28" y="130" width="328" height="80" rx="6" fill="#F3F5F4" stroke="#E4E8E6" stroke-width="1"/>
    <text class="mono" x="38" y="149.5" font-size="12" fill="#1D2523">## Runtime budget</text>
    <text class="mono" x="38" y="166.5" font-size="12" fill="#1D2523">- **Plan tier:** &lt;free | pro | max |</text>
    <text class="mono" x="48" y="183.5" font-size="12" fill="#1D2523">ultra | team-standard | team-premium |</text>
    <text class="mono" x="48" y="200.5" font-size="12" fill="#1D2523">enterprise | api&gt;</text>
    <text class="sans" x="36" y="236" font-size="13" fill="#5A6663">The harness does not tell the plugin which plan</text>
    <text class="sans" x="36" y="254" font-size="13" fill="#5A6663">you are on, so say it here once.</text>
    <text class="sans" x="36" y="280" font-size="13" fill="#5A6663">Change the line when your plan changes;</text>
    <text class="sans" x="36" y="298" font-size="13" fill="#5A6663">nothing else needs to.</text>
  </g>

  <g id="profile-guarded">
    <rect x="792" y="80" width="588" height="115" rx="10" fill="#FDFEFD" stroke="#435954" stroke-width="1.5"/>
    <text class="mono" x="814" y="110" font-size="18" font-weight="700" fill="#1D2523">guarded</text>
    <text class="mono" x="814" y="134" font-size="11.5" fill="#5A6663">concurrency</text>
    <text class="sans" x="914" y="134" font-size="13" fill="#1D2523">one isolated dispatch at a time from the main session;</text>
    <text class="sans" x="914" y="151" font-size="13" fill="#1D2523">wait for its return before the next</text>
    <text class="mono" x="814" y="174" font-size="11.5" fill="#5A6663">workflow</text>
    <text class="sans" x="914" y="174" font-size="13" fill="#1D2523">small (the operator's workflow size guideline; under five agents)</text>
  </g>

  <g id="profile-open">
    <rect x="792" y="207" width="588" height="133" rx="10" fill="#FDFEFD" stroke="#435954" stroke-width="1.5"/>
    <text class="mono" x="814" y="237" font-size="18" font-weight="700" fill="#1D2523">open</text>
    <text class="mono" x="814" y="261" font-size="11.5" fill="#5A6663">concurrency</text>
    <text class="sans" x="914" y="261" font-size="13" fill="#1D2523">independent stages in parallel from the main session;</text>
    <text class="sans" x="914" y="278" font-size="13" fill="#1D2523">the number follows quality and stage dependencies only, never speed;</text>
    <text class="sans" x="914" y="295" font-size="13" fill="#1D2523">the harness ceiling applies</text>
    <text class="mono" x="814" y="318" font-size="11.5" fill="#5A6663">workflow</text>
    <text class="sans" x="914" y="318" font-size="13" fill="#1D2523">unconstrained</text>
  </g>

  <g id="branches">
    <line x1="364" y1="210.0" x2="392" y2="210.0" stroke="#435954" stroke-width="2"/>
    <polyline points="392,210.0 392,137.5 788,137.5" fill="none" stroke="#435954" stroke-width="2" marker-end="url(#head)"/>
    <polyline points="392,210.0 392,273.5 788,273.5" fill="none" stroke="#435954" stroke-width="2" marker-end="url(#head)"/>
    <rect x="406.0" y="109.5" width="41.7" height="20" rx="4" fill="#E4E8E6"/>
    <text class="mono" x="426.847" y="123.5" font-size="11.5" text-anchor="middle" fill="#3E4A47">free</text>
    <rect x="453.7" y="109.5" width="34.8" height="20" rx="4" fill="#E4E8E6"/>
    <text class="mono" x="471.079" y="123.5" font-size="11.5" text-anchor="middle" fill="#3E4A47">pro</text>
    <rect x="494.5" y="109.5" width="34.8" height="20" rx="4" fill="#E4E8E6"/>
    <text class="mono" x="511.849" y="123.5" font-size="11.5" text-anchor="middle" fill="#3E4A47">max</text>
    <rect x="535.2" y="109.5" width="104.0" height="20" rx="4" fill="#E4E8E6"/>
    <text class="mono" x="587.237" y="123.5" font-size="11.5" text-anchor="middle" fill="#3E4A47">team-standard</text>
    <rect x="645.2" y="109.5" width="97.1" height="20" rx="4" fill="#E4E8E6"/>
    <text class="mono" x="693.78" y="123.5" font-size="11.5" text-anchor="middle" fill="#3E4A47">team-premium</text>
    <rect x="406.0" y="245.5" width="48.6" height="20" rx="4" fill="#E4E8E6"/>
    <text class="mono" x="430.309" y="259.5" font-size="11.5" text-anchor="middle" fill="#3E4A47">ultra</text>
    <rect x="460.6" y="245.5" width="83.2" height="20" rx="4" fill="#E4E8E6"/>
    <text class="mono" x="502.234" y="259.5" font-size="11.5" text-anchor="middle" fill="#3E4A47">enterprise</text>
    <rect x="549.9" y="245.5" width="34.8" height="20" rx="4" fill="#E4E8E6"/>
    <text class="mono" x="567.237" y="259.5" font-size="11.5" text-anchor="middle" fill="#3E4A47">api</text>
    <text class="mono" x="406" y="159.5" font-size="12" fill="#4F5A57">slot missing or unreadable: the conductor</text>
    <text class="mono" x="406" y="175.5" font-size="12" fill="#4F5A57">asks you once, at session start, runs</text>
    <text class="mono" x="406" y="191.5" font-size="12" fill="#4F5A57">guarded until answered</text>
    <text class="mono" x="406" y="224" font-size="12" fill="#4F5A57">the conductor derives the dispatch profile</text>
  </g>

  <g id="invariants">
    <rect x="20" y="356" width="1360" height="80" rx="10" fill="#E4E8E6"/>
    <text class="sans" x="38" y="391" font-size="14" font-weight="700" fill="#1D2523">Nothing else moves</text>
    <text class="sans" x="38" y="410" font-size="14" font-weight="700" fill="#1D2523">with the profile:</text>
    <rect x="196.0" y="368" width="280.0" height="24" rx="12" fill="#FDFEFD" stroke="#C6CFCB" stroke-width="1"/>
    <text class="sans" x="335.995" y="384.5" font-size="13" text-anchor="middle" fill="#1D2523">the main session stays the only dispatcher</text>
    <rect x="484.0" y="368" width="156.6" height="24" rx="12" fill="#FDFEFD" stroke="#C6CFCB" stroke-width="1"/>
    <text class="sans" x="562.279" y="384.5" font-size="13" text-anchor="middle" fill="#1D2523">agents never dispatch</text>
    <rect x="648.6" y="368" width="178.5" height="24" rx="12" fill="#FDFEFD" stroke="#C6CFCB" stroke-width="1"/>
    <text class="sans" x="737.804" y="384.5" font-size="13" text-anchor="middle" fill="#1D2523">one deliverable per agent</text>
    <rect x="196.0" y="400" width="134.6" height="24" rx="12" fill="#FDFEFD" stroke="#C6CFCB" stroke-width="1"/>
    <text class="sans" x="263.312" y="416.5" font-size="13" text-anchor="middle" fill="#1D2523">the idle limit holds</text>
    <rect x="338.6" y="400" width="292.5" height="24" rx="12" fill="#FDFEFD" stroke="#C6CFCB" stroke-width="1"/>
    <text class="sans" x="484.877" y="416.5" font-size="13" text-anchor="middle" fill="#1D2523">every dispatch carries the spec and the hash</text>
    <rect x="639.1" y="400" width="249.8" height="24" rx="12" fill="#FDFEFD" stroke="#C6CFCB" stroke-width="1"/>
    <text class="sans" x="764.036" y="416.5" font-size="13" text-anchor="middle" fill="#1D2523">blind-reviewer isolation is unchanged</text>
    <line x1="916.940625" y1="370" x2="916.940625" y2="422" stroke="#C6CFCB" stroke-width="1.3"/>
    <text class="sans" x="936.941" y="392" font-size="16" font-weight="700" fill="#1D2523">“Open” never means free:</text>
    <text class="sans" x="936.941" y="414" font-size="16" font-weight="700" fill="#1D2523">every plan keeps a weekly limit.</text>
  </g>
</svg>
